<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - InfoNix</title>
  <style>
    body.auth-bg {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f4f6f9;
      font-family: Arial, sans-serif;
    }
    .auth-container { width: 100%; max-width: 400px; }
    .auth-card {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 { text-align: center; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
    input {
      width: 100%; padding: 0.7rem; border: 1px solid #ccc;
      border-radius: 8px; outline: none;
    }
    input:focus { border-color: #4a90e2; }
    .auth-btn {
      width: 100%; padding: 0.8rem;
      background: #4a90e2; color: #fff;
      font-size: 1rem; border: none; border-radius: 8px;
      cursor: pointer; transition: 0.3s;
    }
    .auth-btn:hover { background: #357ABD; }
    .auth-link { text-align: center; margin-top: 1rem; }
    .auth-link a { color: #4a90e2; text-decoration: none; }
    .auth-link a:hover { text-decoration: underline; }
    .error-msg {
      color: red; font-size: 0.85em; margin-top: 4px; display: block;
    }
  </style>
</head>
<body class="auth-bg">
  <div class="auth-container">
    <div class="auth-card">
      <h2>Sign Up</h2>
      <form id="signupForm" action="signup.php" method="POST" onsubmit="return validateSignupForm()">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required placeholder="Enter your name">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="Enter your email">
          <small id="emailError" class="error-msg"></small>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="Create a password">
          <small id="passwordError" class="error-msg"></small>
        </div>
        <button type="submit" class="auth-btn">Sign Up</button>
      </form>
      <p class="auth-link">Already have an account? <a href="signin.html">Sign In</a></p>
    </div>
  </div>

  <script>
    function validateSignupForm() {
      let isValid = true;
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const emailError = document.getElementById("emailError");
      const passwordError = document.getElementById("passwordError");
      emailError.textContent = "";
      passwordError.textContent = "";

      // ✅ Email validation
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) {
        emailError.textContent = "❌ Please enter a valid email address.";
        isValid = false;
      }

      // ✅ Strong password validation (>=6 chars, uppercase, lowercase, number, symbol)
      const passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{6,}$/;
      if (!passwordPattern.test(password)) {
        passwordError.textContent =
          "❌ Password must be at least 6 characters and include uppercase, lowercase, number, and symbol.";
        isValid = false;
      }

      return isValid;
    }
  </script>
</body>
</html>
